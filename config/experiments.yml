# Especificación Oficial de Matriz de Experimentos de Machine Learning (Contrato C5)
# Detección de Sujetos sin Capacidad Operativa (SSCO) - SUNAT Risk Scoring

dataset_version: "v1"
seed: 42
scoring_metric: "average_precision"

# Matriz de Experimentos E1..E6 (Sección 4.2.3.F de informe_modelado_ssco.md)
experiments:
  - id: "E1"
    model_name: "LR"
    variant: "V2"
    usa_pesos: "si"
    priority: "MUST"
    description: "Candidato Oficial 1: Regresión Logística con features V2 (sin fuga) y pesos de clase balanceados"
    hyperparameters:
      param_grid:
        model__C: [0.01, 0.1, 1.0, 10.0]

  - id: "E2"
    model_name: "DT"
    variant: "V2"
    usa_pesos: "si"
    priority: "MUST"
    description: "Candidato Oficial 2: Árbol de Decisión con features V2 (sin fuga) y pesos de clase balanceados"
    hyperparameters:
      param_grid:
        model__max_depth: [3, 5, 6]
        model__min_samples_leaf: [50, 200]

  - id: "E3"
    model_name: "LR"
    variant: "V1"
    usa_pesos: "si"
    priority: "MUST"
    description: "Benchmark Techo: Regresión Logística con features V1 (incluye Estado/Condicion con fuga)"
    hyperparameters:
      param_grid:
        model__C: [0.01, 0.1, 1.0, 10.0]

  - id: "E4"
    model_name: "DT"
    variant: "V1"
    usa_pesos: "si"
    priority: "MUST"
    description: "Benchmark Techo: Árbol de Decisión con features V1 (incluye Estado/Condicion con fuga)"
    hyperparameters:
      param_grid:
        model__max_depth: [3, 5, 6]
        model__min_samples_leaf: [50, 200]

  - id: "E5"
    model_name: "LR"
    variant: "V2"
    usa_pesos: "no"
    priority: "MUST"
    description: "Control de Ablación: Regresión Logística V2 sin reponderación de clases"
    hyperparameters:
      param_grid:
        model__C: [0.01, 0.1, 1.0, 10.0]

  - id: "E6"
    model_name: "DT"
    variant: "V2"
    usa_pesos: "no"
    priority: "MUST"
    description: "Control de Ablación: Árbol de Decisión V2 sin reponderación de clases"
    hyperparameters:
      param_grid:
        model__max_depth: [3, 5, 6]
        model__min_samples_leaf: [50, 200]

  # Experimentos adicionales sobre el mismo dataset: exploran la grilla de cada
  # familia (V2 con pesos) y compiten con E1/E2 por el puesto de campeón.
  - id: "E9"
    model_name: "LR"
    variant: "V2"
    usa_pesos: "si"
    priority: "SHOULD"
    description: "Exploración LR V2: rango de regularización C ampliado"
    hyperparameters:
      param_grid:
        model__C: [0.001, 0.003, 0.03, 0.3, 3.0, 30.0, 100.0]

  - id: "E10"
    model_name: "DT"
    variant: "V2"
    usa_pesos: "si"
    priority: "SHOULD"
    description: "Exploración DT V2: árboles más profundos con hojas más grandes"
    hyperparameters:
      param_grid:
        model__max_depth: [8, 10, 12]
        model__min_samples_leaf: [20, 100, 500]

  - id: "E11"
    model_name: "DT"
    variant: "V2"
    usa_pesos: "si"
    priority: "SHOULD"
    description: "Exploración DT V2: criterio de entropía y poda por complejidad"
    hyperparameters:
      param_grid:
        model__criterion: ["entropy"]
        model__max_depth: [5, 8]
        model__min_samples_leaf: [50, 200]
        model__ccp_alpha: [0.0, 0.00001, 0.0001]

  - id: "E12"
    model_name: "DT"
    variant: "V2"
    usa_pesos: "si"
    priority: "SHOULD"
    description: "Exploración DT V2: criterio de Gini con divisiones mínimas amplias"
    hyperparameters:
      param_grid:
        model__criterion: ["gini"]
        model__max_depth: [4, 7]
        model__min_samples_split: [100, 500, 2000]
        model__min_samples_leaf: [50, 200]
