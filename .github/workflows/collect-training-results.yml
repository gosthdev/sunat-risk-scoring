name: Collect Training Results

# Muestra el estado de la corrida (instancia EC2 o Training Job de SageMaker), el uso de
# recursos y el leaderboard.
# Se puede ejecutar en cualquier momento, antes o después de que termine el entrenamiento.

on:
  workflow_dispatch:
    inputs:
      run_tag:
        description: "run_tag de la corrida (ver el resumen del workflow Train & Benchmark SSCO Models)"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
  GOLD_BUCKET: ${{ vars.GOLD_BUCKET || secrets.GOLD_BUCKET || 'sunat-risk-scoring-gold' }}

jobs:
  collect:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'aws-main' || 'aws-develop' }}
    timeout-minutes: 15
    steps:
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Report instance status, resource usage and leaderboard
        env:
          TAG: ${{ inputs.run_tag }}
        run: |
          set -uo pipefail
          mkdir -p out
          {
            echo "### Instancia \`ssco-train-${TAG}\`"
            aws ec2 describe-instances --filters "Name=tag:Name,Values=ssco-train-${TAG}" \
              --query 'Reservations[].Instances[].{id:InstanceId,tipo:InstanceType,estado:State.Name,lanzada:LaunchTime}' \
              --output table 2>/dev/null || echo "No hay instancia EC2 para este tag."
            echo ""
            echo "### Training Job de SageMaker \`ssco-all-${TAG}\`"
            aws sagemaker describe-training-job --training-job-name "ssco-all-${TAG}" \
              --query '{estado:TrainingJobStatus,secundario:SecondaryStatus,razon:FailureReason,instancia:ResourceConfig.InstanceType,segundos:TrainingTimeInSeconds}' \
              --output table 2>/dev/null || echo "No hay Training Job de SageMaker para este tag."
            echo ""
            echo "### Uso de recursos y avance (últimas líneas del log)"
            if aws s3 cp "s3://${GOLD_BUCKET}/model_logs/tag=${TAG}/train.log" out/train.log --only-show-errors; then
              echo '```'
              grep -E "\[MON\]|\[DONE\]" out/train.log | tail -12
              echo '```'
            else
              echo "Aún no hay log."
            fi
            echo ""
            echo "### Leaderboard"
          } >> "$GITHUB_STEP_SUMMARY"
          if aws s3 cp "s3://${GOLD_BUCKET}/model_leaderboards/tag=${TAG}/leaderboard.md" - >> "$GITHUB_STEP_SUMMARY"; then
            echo "Leaderboard publicado."
          else
            echo "Aún no hay leaderboard (la instancia no ha terminado)." >> "$GITHUB_STEP_SUMMARY"
          fi
          aws s3 cp "s3://${GOLD_BUCKET}/model_leaderboards/tag=${TAG}/leaderboard.png" out/leaderboard.png --only-show-errors || true

      - name: Upload leaderboard chart
        uses: actions/upload-artifact@v4
        with:
          name: leaderboard-${{ inputs.run_tag }}
          path: out/leaderboard.png
          if-no-files-found: ignore
          retention-days: 30
