name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

# En push no se cancela: cortar una corrida haría que trigger-pipeline no vea sus cambios.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  terraform:
    name: Terraform Checks (fmt + validate + tflint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init & Validate (state, storage & services)
        run: |
          cd state
          terraform init -backend=false
          terraform validate
          cd ../storage
          terraform init -backend=false
          terraform validate
          cd ../services
          terraform init -backend=false
          terraform validate

      - name: TFLint Init & Run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tflint --init --config "$(pwd)/.tflint.hcl"
          tflint --recursive --config "$(pwd)/.tflint.hcl"

  python:
    name: Python (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install ruff mypy pytest
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      # Aplica correcciones automáticas de lint y formato con ruff
      - name: Auto-fix con ruff
        if: ${{ hashFiles('**/*.py') != '' }}
        run: |
          ruff check --fix . || true
          ruff format .

      # Si hubo cambios, hace commit y push automático a la rama
      - name: Commit y push de correcciones
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style(auto): correcciones automáticas de ruff"
          branch: ${{ github.head_ref || github.ref_name }}

      # Errores de código no corregibles automáticamente
      - name: Lint (ruff check)
        if: ${{ hashFiles('**/*.py') != '' }}
        run: ruff check .

      # Tipos: detecta llamadas con argumentos incorrectos antes de ejecutar.
      - name: Tipos (mypy)
        if: ${{ hashFiles('src/**/*.py') != '' }}
        run: mypy src

      - uses: actions/setup-java@v4
        if: ${{ hashFiles('tests/**/*.py') != '' }}
        with:
          distribution: temurin
          java-version: "17"

      - name: Tests
        if: ${{ hashFiles('tests/**/*.py') != '' }}
        run: pytest -q

  # CD: si CI pasó y el push tocó código de datos, lanza pipeline.yml como corrida
  # aparte (sus marcadores deciden qué etapas se rehacen).
  trigger-pipeline:
    name: Trigger Data Pipeline
    needs: [terraform, python]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lanzar pipeline.yml si cambió código de datos
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          # shortcut: solo mira este push; si un push anterior falló CI, sus cambios
          # esperan al siguiente pipeline (los marcadores los detectan igual).
          # Rama nueva o historia reescrita: no hay base para comparar, se lanza igual.
          if [[ "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            changed="(sin base de comparación)"
          else
            changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- \
              src/spark src/analysis/queries infra/ingestion_ec2 src/requirements.txt)
          fi
          if [[ -z "$changed" ]]; then
            echo "El push no toca código de datos: no se lanza el pipeline."
            exit 0
          fi
          echo "Cambios de datos:"; echo "$changed"
          gh workflow run pipeline.yml --ref "$GITHUB_REF_NAME"
