name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform Checks (fmt + validate + tflint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init & Validate (dev)
        run: |
          cd enviroments/dev
          terraform init -backend=false
          terraform validate

      - name: TFLint Init & Run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tflint --init --config "$(pwd)/.tflint.hcl"
          tflint --recursive --config "$(pwd)/.tflint.hcl"

  python:
    name: Python (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install ruff mypy pytest
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      # Errores de código: variables sin usar, imports rotos, bugs típicos, riesgos de seguridad.
      - name: Lint (ruff check)
        if: ${{ hashFiles('**/*.py') != '' }}
        run: ruff check .

      # Formato: indentación, espacios, comillas, saltos de línea.
      - name: Formato (ruff format)
        if: ${{ hashFiles('**/*.py') != '' }}
        run: ruff format --check .

      # Tipos: detecta llamadas con argumentos incorrectos antes de ejecutar.
      - name: Tipos (mypy)
        if: ${{ hashFiles('src/**/*.py') != '' }}
        run: mypy src

      - uses: actions/setup-java@v4
        if: ${{ hashFiles('tests/**/*.py') != '' }}
        with:
          distribution: temurin
          java-version: "17"

      - name: Tests
        if: ${{ hashFiles('tests/**/*.py') != '' }}
        run: pytest -q