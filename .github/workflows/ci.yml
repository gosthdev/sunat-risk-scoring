name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform Checks (fmt + validate + tflint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init & Validate (storage & services)
        run: |
          cd storage
          terraform init -backend=false
          terraform validate
          cd ../services
          terraform init -backend=false
          terraform validate

      - name: TFLint Init & Run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tflint --init --config "$(pwd)/.tflint.hcl"
          tflint --recursive --config "$(pwd)/.tflint.hcl"

  python:
    name: Python (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install ruff mypy pytest
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      # Aplica correcciones automáticas de lint y formato con ruff
      - name: Auto-fix con ruff
        if: ${{ hashFiles('**/*.py') != '' }}
        run: |
          ruff check --fix . || true
          ruff format .

      # Si hubo cambios, hace commit y push automático a la rama
      - name: Commit y push de correcciones
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style(auto): correcciones automáticas de ruff"
          branch: ${{ github.head_ref || github.ref_name }}

      # Errores de código no corregibles automáticamente
      - name: Lint (ruff check)
        if: ${{ hashFiles('**/*.py') != '' }}
        run: ruff check .

      # Tipos: detecta llamadas con argumentos incorrectos antes de ejecutar.
      - name: Tipos (mypy)
        if: ${{ hashFiles('src/**/*.py') != '' }}
        run: mypy src

      - uses: actions/setup-java@v4
        if: ${{ hashFiles('tests/**/*.py') != '' }}
        with:
          distribution: temurin
          java-version: "17"

      - name: Tests
        if: ${{ hashFiles('tests/**/*.py') != '' }}
        run: pytest -q