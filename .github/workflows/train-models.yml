name: Train & Benchmark SSCO Models

# El curado corre en EMR Serverless. El entrenamiento corre en runners de GitHub: un job
# por experimento (cada uno con su propia memoria) que publica su resultado en S3. El dataset
# se baja de S3 una sola vez y se comparte por la caché de GitHub. Un job final reúne los
# resultados publicados, arma el leaderboard con su gráfico y los guarda en S3.

on:
  workflow_dispatch:
    inputs:
      experiments:
        description: "Experimentos a ejecutar (ALL, o separados por comas: E1,E2,E5,E6)"
        required: false
        type: string
        default: "ALL"
      dataset_version:
        description: "Versión del dataset (model_inputs/dataset_version=<v>)"
        required: false
        type: string
        default: "v1"
      rebuild_dataset:
        description: "Regenerar model_inputs con el Job 06 aunque ya exista"
        required: false
        type: boolean
        default: false
      n_jobs:
        description: "Procesos paralelos del GridSearchCV en cada job (cada uno copia X_train: con 10 M de filas, subir solo si sobra RAM)"
        required: false
        type: number
        default: 1
      run_tag:
        description: "Sufijo de la corrida (vacío = id de esta ejecución). Repetir el mismo tag reanuda sin repetir experimentos terminados."
        required: false
        type: string
        default: ""

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
  DATALAKE_BUCKET: ${{ vars.DATALAKE_BUCKET || secrets.DATALAKE_BUCKET || 'sunat-risk-scoring' }}
  ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET || secrets.ARTIFACTS_BUCKET || 'sunat-risk-scoring-artifacts' }}
  RAW_BUCKET: ${{ vars.RAW_BUCKET || secrets.RAW_BUCKET || 'sunat-risk-scoring-raw' }}
  BRONZE_BUCKET: ${{ vars.BRONZE_BUCKET || secrets.BRONZE_BUCKET || 'sunat-risk-scoring-bronze' }}
  SILVER_BUCKET: ${{ vars.SILVER_BUCKET || secrets.SILVER_BUCKET || 'sunat-risk-scoring-silver' }}
  GOLD_BUCKET: ${{ vars.GOLD_BUCKET || secrets.GOLD_BUCKET || 'sunat-risk-scoring-gold' }}
  EMR_APPLICATION_ID: ${{ vars.EMR_APPLICATION_ID || secrets.EMR_APPLICATION_ID || '' }}
  EMR_EXECUTION_ROLE_ARN: ${{ vars.EMR_EXECUTION_ROLE_ARN || secrets.EMR_EXECUTION_ROLE_ARN || '' }}
  DATASET_VERSION: ${{ inputs.dataset_version }}

jobs:
  prepare-dataset:
    name: Prepare model_inputs (EMR Job 06)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check existing dataset
        id: check
        run: |
          set -euo pipefail
          PREFIX="s3://${GOLD_BUCKET}/model_inputs/dataset_version=${DATASET_VERSION}/"
          if [ "${{ inputs.rebuild_dataset }}" = "true" ]; then
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$(aws s3 ls "${PREFIX}" --recursive | grep '\.parquet' | head -1)" ]; then
            echo "Dataset ya existe en ${PREFIX}; se omite el Job 06."
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and upload Spark jobs
        if: steps.check.outputs.needs_build == 'true'
        run: |
          set -euo pipefail
          bash src/spark/jobs/package_jobs.sh
          aws s3 cp src/spark/jobs/common.zip "s3://${ARTIFACTS_BUCKET}/jobs/common.zip"
          aws s3 sync src/spark/jobs/ "s3://${ARTIFACTS_BUCKET}/jobs/" --exclude "*" --include "0*.py"

      - name: Submit Job 06 to EMR Serverless
        if: steps.check.outputs.needs_build == 'true'
        run: |
          set -euo pipefail
          bash src/spark/jobs/05_submit_spark_steps.sh --only-steps 06_dataset_curado

      - name: Verify dataset was written
        run: |
          set -euo pipefail
          PREFIX="s3://${GOLD_BUCKET}/model_inputs/dataset_version=${DATASET_VERSION}/"
          if [ -z "$(aws s3 ls "${PREFIX}" --recursive | grep '\.parquet' | head -1)" ]; then
            echo "ERROR: no hay archivos .parquet en ${PREFIX}" >&2
            exit 1
          fi
          aws s3 ls "${PREFIX}" --recursive --human-readable --summarize | tail -2

  fetch-dataset:
    name: Fetch dataset (single S3 download)
    needs: [prepare-dataset]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      cache_key: ${{ steps.key.outputs.cache_key }}
    steps:
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Los runners de GitHub están fuera de AWS: cada byte que sale de S3 se cobra como
      # transferencia a internet. Se descarga una sola vez y los jobs de entrenamiento
      # lo restauran desde la caché de GitHub. La clave depende del listado de S3
      # (nombres, tamaños y fechas), así que un dataset regenerado invalida la caché.
      - name: Compute cache key
        id: key
        run: |
          set -euo pipefail
          PREFIX="s3://${GOLD_BUCKET}/model_inputs/dataset_version=${DATASET_VERSION}/"
          HASH="$(aws s3 ls "${PREFIX}" --recursive | sha256sum | cut -c1-16)"
          echo "cache_key=dataset-${DATASET_VERSION}-${HASH}" >> "$GITHUB_OUTPUT"

      - name: Check dataset cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ./data/input
          key: ${{ steps.key.outputs.cache_key }}
          lookup-only: true

      - name: Download dataset (cache miss)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ./data/input
          aws s3 cp "s3://${GOLD_BUCKET}/model_inputs/dataset_version=${DATASET_VERSION}/" ./data/input/ \
            --recursive --exclude "*" --include "*.parquet"
          du -sh ./data/input

      - name: Save dataset cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ./data/input
          key: ${{ steps.key.outputs.cache_key }}

  plan:
    name: Plan experiments
    needs: [prepare-dataset]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      experiments: ${{ steps.plan.outputs.experiments }}
      run_tag: ${{ steps.plan.outputs.run_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select experiments
        id: plan
        env:
          EXPERIMENTS: ${{ inputs.experiments }}
          INPUT_TAG: ${{ inputs.run_tag }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          import yaml

          with open("config/experiments.yml", encoding="utf-8") as f:
              todos = [str(e["id"]) for e in yaml.safe_load(f)["experiments"]]
          pedido = os.environ["EXPERIMENTS"].strip()
          if pedido.upper() in ("", "ALL"):
              elegidos = todos
          else:
              ids = [x.strip().upper() for x in pedido.split(",") if x.strip()]
              desconocidos = [i for i in ids if i not in todos]
              if desconocidos:
                  raise SystemExit(f"Experimentos desconocidos: {desconocidos}")
              elegidos = [i for i in todos if i.upper() in ids]
          print(f"experiments={json.dumps(elegidos)}")
          print(f"run_tag={os.environ['INPUT_TAG'] or os.environ['GITHUB_RUN_ID']}")
          PY

  train:
    name: Train ${{ matrix.experiment }}
    needs: [plan, fetch-dataset]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        experiment: ${{ fromJSON(needs.plan.outputs.experiments) }}
    env:
      RUN_TAG: ${{ needs.plan.outputs.run_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/models/requirements.txt
          # Falla aquí, con el error real, si pandas no puede leer parquet.
          python -c "import pandas, pyarrow, numpy, sklearn; print('pandas', pandas.__version__, '| pyarrow', pyarrow.__version__, '| numpy', numpy.__version__, '| sklearn', sklearn.__version__)"

      - name: Restore dataset from cache
        uses: actions/cache/restore@v4
        with:
          path: ./data/input
          key: ${{ needs.fetch-dataset.outputs.cache_key }}
          fail-on-cache-miss: true

      # Solo se necesita para publicar resultados: subir a S3 desde fuera de AWS no se cobra.
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Train ${{ matrix.experiment }}
        run: |
          set -euo pipefail
          # El resultado y los gráficos se publican en S3 apenas termina el experimento;
          # el leaderboard lo arma el job final.
          python -m src.models.orchestrator \
            --config config/experiments.yml \
            --experiments "${{ matrix.experiment }}" \
            --target runner \
            --train_dir ./data/input \
            --output_dir ./data/output/orchestrator \
            --dataset_version "${DATASET_VERSION}" \
            --n_jobs "${{ inputs.n_jobs || 1 }}" \
            --run_tag "${RUN_TAG}" \
            --gold_bucket "${GOLD_BUCKET}" \
            --publicar_s3 si \
            --publicar_leaderboard no \
            --graficos si \
            --reanudar si

      - name: Upload experiment plots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plots-${{ matrix.experiment }}-${{ needs.plan.outputs.run_tag }}
          path: ./data/output/orchestrator/plots/
          if-no-files-found: ignore
          retention-days: 30

  leaderboard:
    name: Build leaderboard
    needs: [plan, train]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/models/requirements.txt

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Consolidate results from S3
        env:
          RUN_TAG: ${{ needs.plan.outputs.run_tag }}
          EXPERIMENTS: ${{ join(fromJSON(needs.plan.outputs.experiments), ',') }}
        run: |
          set -euo pipefail
          echo "train=${{ needs.train.result }} experimentos=${EXPERIMENTS}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ needs.train.result }}" = "skipped" ]; then
            echo "::error::El job train no se ejecutó (matriz vacía o job omitido)."
          fi
          python -m src.models.orchestrator \
            --config config/experiments.yml \
            --experiments "${EXPERIMENTS}" \
            --target consolidar \
            --dataset_version "${DATASET_VERSION}" \
            --run_tag "${RUN_TAG}" \
            --gold_bucket "${GOLD_BUCKET}" \
            --output_dir ./data/output/orchestrator
          {
            echo ""
            echo "Resultados en S3: \`s3://${GOLD_BUCKET}/model_leaderboards/tag=${RUN_TAG}/\`"
            echo "Gráficos por experimento: \`s3://${GOLD_BUCKET}/model_reports/\`"
            echo "El gráfico del leaderboard y los de cada experimento están en los *Artifacts* de esta ejecución."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload leaderboard chart
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leaderboard-${{ needs.plan.outputs.run_tag }}
          path: |
            ./data/output/orchestrator/leaderboard.png
            ./data/output/orchestrator/leaderboard.md
            ./data/output/orchestrator/leaderboard.json
          if-no-files-found: ignore
          retention-days: 30
