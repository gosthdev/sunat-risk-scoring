[tool.mypy]
python_version = "3.11"
mypy_path = "src/spark/common"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "awswrangler",
    "boto3",
    "botocore.*",
    "openpyxl",
    "smart_open",
    "smart_open.*",
    "catboost",
    "catboost.*",
    "joblib",
    "joblib.*",
    "sklearn",
    "sklearn.*",
    "matplotlib",
    "matplotlib.*",
    "pandas",
    "pandas.*",
    "pyarrow",
    "pyarrow.*",
    "evaluation.metrics",
    "evaluation.visualizations",
    "explainability",
    "export_outputs",
    "yaml",
    "mlflow",
    "mlflow.*",
]
ignore_missing_imports = true


[tool.pytest.ini_options]
pythonpath = [
    "src/spark/common",
    "src/spark/jobs",
]

