[tool.mypy]
python_version = "3.11"
mypy_path = "src/spark/common"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "awswrangler",
    "boto3",
    "openpyxl",
    "smart_open",
    "smart_open.*",
    "joblib",
    "joblib.*",
    "sklearn",
    "sklearn.*",
    "explainability",
    "export_outputs",
    "yaml",
]
ignore_missing_imports = true


[tool.pytest.ini_options]
pythonpath = [
    "src/spark/common",
    "src/spark/jobs",
]

